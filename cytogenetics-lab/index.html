<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>Cytogenetics Laboratory — Evonyx</title>
  <link rel="stylesheet" href="css/app.css?v=20261026guide2" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">CG</span>
        <div>
          <p class="brand-kicker">Evonyx</p>
          <h1>Cytogenetics Laboratory</h1>
        </div>
      </div>
    </header>
    <p class="disclaimer">Educational use only. This program is not a clinical diagnostic device and does not interpret patient specimens.</p>
    <main class="panel">
      <h2>Loading the laboratory…</h2>
      <p>If this screen does not change, hard-refresh or open <code>http://127.0.0.1:8765/</code>.</p>
    </main>
  </div>
  <script>
    window.addEventListener("error", function (ev) {
      var app = document.getElementById("app");
      if (!app) return;
      var msg = (ev && ev.message) ? ev.message : "Unknown script error";
      app.insertAdjacentHTML("beforeend", "<main class='panel error-panel'><h2>Script error</h2><p>" + msg + "</p></main>");
    });
  </script>
  <script type="module" src="js/main.js?v=20261026rep2"></script>
  <script nomodule>
    document.getElementById("app").innerHTML = "<main class='panel error-panel'><h2>JavaScript modules are required</h2><p>Open this laboratory in an up-to-date browser.</p></main>";
  </script>
</body>
</html>
