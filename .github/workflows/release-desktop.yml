# Build Windows portable + Mac Apple Silicon packages and attach them to the tag release.
# Uploads go straight to the GitHub Release (not Actions artifacts) to avoid storage quota limits.

name: Release desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach (e.g. v1.0.4)"
        required: true
        type: string

permissions:
  contents: write

env:
  FORCE_COLOR: "1"

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: cytogenetics-lab
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "name=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cytogenetics-lab/package-lock.json

      - name: Install dependencies (Electron rebuild)
        run: |
          npm ci --ignore-scripts
          node electron/ensure-binary.js
          npx electron-builder install-app-deps

      - name: Package Windows portable
        run: npm run package:win

      - name: Attach Windows portable to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Cytogenetics Laboratory ${{ steps.tag.outputs.version }}
          draft: false
          make_latest: true
          fail_on_unmatched_files: true
          files: cytogenetics-lab/dist/*.exe
          body: |
            ## Self-contained student package

            Students only need to download and open the app — **no Python, no npm, no separate server**.

            The cytogenetics reference database ships inside the app (SQLite via Node).

            ### Downloads
            - **Windows (portable):** `Cytogenetics Laboratory *.exe` — double-click to run (no installer).
            - **Mac (Apple Silicon):** `.dmg` or `-mac.zip`.

            ### Windows trust warning (unsigned build)
            This educational build is **not code-signed**. Chrome or SmartScreen may say the file “isn’t commonly downloaded” or is unrecognized. Choose **Keep**, then **More info → Run anyway** if Windows blocks it. That warning is about reputation, not a broken package.

            ### First open on Mac (unsigned build)
            Right-click the app → **Open** → confirm. Gatekeeper may block a normal double-click once.

            ### What’s included
            Guided karyotyping, FISH casework, case reports, PDF export via a Save dialog, and the full reference library — offline in one package.

  build-mac:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: cytogenetics-lab
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "name=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cytogenetics-lab/package-lock.json

      - name: Install dependencies (Electron rebuild)
        run: |
          npm ci --ignore-scripts
          node electron/ensure-binary.js
          npx electron-builder install-app-deps

      - name: Package Mac (unsigned)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run package:mac

      - name: Attach Mac packages to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Cytogenetics Laboratory ${{ steps.tag.outputs.version }}
          draft: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            cytogenetics-lab/dist/*.dmg
            cytogenetics-lab/dist/*-mac.zip
          body: |
            ## Self-contained student package

            Students only need to download and open the app — **no Python, no npm, no separate server**.

            The cytogenetics reference database ships inside the app (SQLite via Node).

            ### Downloads
            - **Windows (portable):** `Cytogenetics Laboratory *.exe` — double-click to run (no installer).
            - **Mac (Apple Silicon):** `.dmg` or `-mac.zip`.

            ### Windows trust warning (unsigned build)
            This educational build is **not code-signed**. Chrome or SmartScreen may say the file “isn’t commonly downloaded” or is unrecognized. Choose **Keep**, then **More info → Run anyway** if Windows blocks it. That warning is about reputation, not a broken package.

            ### First open on Mac (unsigned build)
            Right-click the app → **Open** → confirm. Gatekeeper may block a normal double-click once.

            ### What’s included
            Guided karyotyping, FISH casework, case reports, PDF export via a Save dialog, and the full reference library — offline in one package.
